
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Your Order | Avelisse Atelier</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

    <!-- TRACK ORDER PAGE -->
    <main class="track-order-page">

        <p class="track-breadcrumb">
            <a href="index.html">HOME</a> / TRACK ORDER
        </p>

        <h1>Track your order.</h1>

        <p class="track-intro">
            Enter your order number and the email you used at checkout
            to see its status.
        </p>

        <form class="track-order-form" id="trackOrderForm">

            <div class="track-field">
                <label for="orderNumber">ORDER NUMBER</label>
                <input
                    type="text"
                    id="orderNumber"
                    name="orderNumber"
                    placeholder="e.g. AVE-00123"
                    required
                >
            </div>

            <div class="track-field">
                <label for="orderEmail">EMAIL</label>
                <input
                    type="email"
                    id="orderEmail"
                    name="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <button type="submit" class="track-submit">
                TRACK ORDER <span>→</span>
            </button>

            <p class="track-message" id="trackMessage" aria-live="polite"></p>

        </form>

    </main>

    <script>
        document.getElementById("trackOrderForm").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("trackMessage").textContent =
                "Order tracking is not connected yet. Once order management is set up, you will be able to check your order status here.";
        });
    </script>

</body>
</html>
